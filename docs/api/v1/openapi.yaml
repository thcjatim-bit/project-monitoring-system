openapi: 3.1.0
info:
  title: Project Monitoring System read API
  version: 1.0.0
  description: >-
    Read-only API untuk konsumen internal THC. Kontrak v1 memakai snake_case,
    identifier bisnis, response envelope data/meta/links, dan cursor opaque
    bertanda tangan. Perubahan breaking memakai /api/v2.
servers:
  - url: /api/v1
security:
  - bearerApiKey: []
x-collection-parameters: &collectionParameters
  - $ref: '#/components/parameters/FilterProject'
  - $ref: '#/components/parameters/FilterMitra'
  - $ref: '#/components/parameters/FilterPeriodFrom'
  - $ref: '#/components/parameters/FilterPeriodTo'
  - $ref: '#/components/parameters/FilterRisk'
  - $ref: '#/components/parameters/FilterProjectStatus'
  - $ref: '#/components/parameters/ReportingAsOf'
  - $ref: '#/components/parameters/PageSize'
  - $ref: '#/components/parameters/PageCursor'
x-read-responses: &readResponses
  '200':
    description: Successful read projection.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/SuccessEnvelope' }
  '401':
    description: Missing, invalid, expired, or revoked API key.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  '403':
    description: Permission or scope denial.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  '404':
    description: Resource is absent or outside a scoped key.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  '405':
    description: Write method rejected; API is read-only.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  '406':
    description: Requested media type is not supported.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  '422':
    description: Invalid parameter or filter.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  '429':
    description: Rate limit exceeded.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  '500':
    description: Redacted internal error.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  '503':
    description: Available source dependency temporarily unavailable.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/ErrorEnvelope' }
paths:
  /portfolio:
    get:
      operationId: getPortfolio
      summary: Portfolio KPI, trend, health, status distribution, activity, dan queue
      parameters: *collectionParameters
      responses: *readResponses
  /portfolio/projects:
    get:
      operationId: getPortfolioProjects
      summary: Health Matrix project
      parameters: *collectionParameters
      responses: *readResponses
  /portfolio/decision-queue:
    get:
      operationId: getPortfolioDecisionQueue
      summary: Decision Queue read projection
      parameters: *collectionParameters
      responses: *readResponses
  /projects:
    get:
      operationId: listProjects
      summary: Project collection
      parameters: *collectionParameters
      responses: *readResponses
  /projects/{project}:
    get:
      operationId: getProject
      summary: Project detail
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/ReportingAsOf'
      responses: *readResponses
  /projects/{project}/curve:
    get:
      operationId: getProjectCurve
      summary: Kurva S, SPI, dan baseline project
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/ReportingAsOf'
      responses: *readResponses
  /stocks:
    get:
      operationId: listStocks
      summary: Curated stock projection
      parameters: *collectionParameters
      responses: *readResponses
  /material-requests:
    get:
      operationId: listMaterialRequests
      summary: Request Material projection
      parameters: *collectionParameters
      responses: *readResponses
  /material-transactions:
    get:
      operationId: listMaterialTransactions
      summary: Curated Material transaction projection
      parameters: *collectionParameters
      responses: *readResponses
  /material-reconciliations:
    get:
      operationId: listMaterialReconciliations
      summary: Rekon Material projection from the approved source domain
      parameters: *collectionParameters
      responses: *readResponses
  /mitra-service-prices:
    get:
      operationId: listMitraServicePrices
      summary: Harga Jasa Mitra projection
      parameters: *collectionParameters
      responses: *readResponses
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: pms_live_opaque
      description: >-
        Hanya Authorization: Bearer pms_live_... yang diterima. Query string,
        cookie, request body, dan header Authorization duplikat ditolak.
  parameters:
    ProjectPath:
      name: project
      in: path
      required: true
      description: ID Project bisnis, bukan numeric database ID.
      schema: { type: string, example: PRJ-2608-0001 }
    ReportingAsOf:
      name: reporting_as_of
      in: query
      description: Tanggal bisnis inklusif; default Asia/Jakarta hari ini.
      schema: { type: string, format: date }
    Include:
      name: include
      in: query
      description: >-
        Comma-separated allowlist. Tidak ada include=all atau arbitrary
        relationship.
      schema:
        type: string
        enum: [mitra, steps, curve, material_readiness, material_requests, material_transactions, service_prices, photo_links]
    FilterProject:
      name: filter[project]
      in: query
      description: Comma-separated ID Project bisnis.
      schema: { type: string }
    FilterMitra:
      name: filter[mitra]
      in: query
      description: Comma-separated Mitra.kode; key scoped Mitra tidak boleh memilih Mitra lain.
      schema: { type: string }
    FilterPeriodFrom:
      name: filter[period_from]
      in: query
      schema: { type: string, format: date }
    FilterPeriodTo:
      name: filter[period_to]
      in: query
      schema: { type: string, format: date }
    FilterRisk:
      name: filter[risk_status]
      in: query
      schema: { type: string, enum: [healthy, watch, critical, na] }
    FilterProjectStatus:
      name: filter[status_project]
      in: query
      schema: { type: string, enum: [aktif, selesai] }
    PageSize:
      name: page[size]
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    PageCursor:
      name: page[cursor]
      in: query
      description: Opaque cursor terikat endpoint, filter, scope, dan sort.
      schema: { type: string }
    IncludeCollection:
      $ref: '#/components/parameters/Include'
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          description: Resource-specific read projection; collection resources return an array.
          oneOf:
            - $ref: '#/components/schemas/Portfolio'
            - $ref: '#/components/schemas/Curve'
            - $ref: '#/components/schemas/Project'
            - type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/Project'
                  - $ref: '#/components/schemas/DecisionQueueItem'
                  - $ref: '#/components/schemas/Stock'
                  - $ref: '#/components/schemas/MaterialRequest'
                  - $ref: '#/components/schemas/MaterialTransaction'
                  - $ref: '#/components/schemas/Reconciliation'
                  - $ref: '#/components/schemas/ServicePrice'
        meta:
          $ref: '#/components/schemas/Meta'
        links:
          type: object
          properties:
            self: { type: string, format: uri-reference }
            next: { type: string, format: uri-reference, nullable: true }
            prev: { type: string, format: uri-reference, nullable: true }
    Meta:
      type: object
      required: [api_version, read_at, reporting_as_of, scope, filters, request_id]
      properties:
        api_version: { type: string, example: v1 }
        read_at: { type: string, format: date-time }
        reporting_as_of: { type: string, format: date }
        request_id: { type: string, format: uuid }
        scope:
          type: object
          required: [type, mitra]
          properties:
            type: { type: string, enum: [thc, mitra] }
            mitra: { type: string, nullable: true, description: Mitra.kode }
        filters: { type: object }
        pagination:
          type: object
          properties:
            size: { type: integer }
            has_more: { type: boolean }
            next_cursor: { type: string, nullable: true }
            prev_cursor: { type: string, nullable: true }
    ErrorEnvelope:
      type: object
      required: [errors, meta]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              details: { type: object }
        meta:
          type: object
          required: [api_version, request_id]
          properties:
            api_version: { type: string, example: v1 }
            request_id: { type: string, format: uuid }
    Project:
      type: object
      required: [id_project, name, mitra, status_project, risk_status]
      properties:
        id_project: { type: string }
        name: { type: string }
        mitra:
          $ref: '#/components/schemas/MitraReference'
        status_project: { type: string, enum: [aktif, selesai] }
        toc: { type: string, format: date, nullable: true }
        verified_percent: { type: number }
        pending_percent: { type: number }
        spi: { type: number, nullable: true }
        spi_status: { type: string, enum: [healthy, watch, critical, na] }
        risk_status: { type: string, enum: [healthy, watch, critical, na] }
        risk_reasons:
          type: array
          items: { type: string }
        material_readiness_percent: { type: number, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        steps:
          type: array
          items: { $ref: '#/components/schemas/Step' }
        curve: { $ref: '#/components/schemas/Curve' }
        material_readiness: { $ref: '#/components/schemas/MaterialReadiness' }
        material_requests:
          type: array
          items: { $ref: '#/components/schemas/MaterialRequest' }
        material_transactions:
          type: array
          items: { $ref: '#/components/schemas/MaterialTransaction' }
        service_prices:
          type: array
          items: { $ref: '#/components/schemas/ServicePrice' }
        photo_links:
          type: array
          items: { $ref: '#/components/schemas/PhotoLink' }
    MitraReference:
      type: object
      required: [code, name]
      properties:
        code: { type: string, description: Mitra.kode }
        name: { type: string }
    Step:
      type: object
      required: [step, label, urutan, status]
      properties:
        step: { type: string }
        label: { type: string }
        urutan: { type: integer }
        status: { type: string }
        completed_at: { type: string, format: date-time, nullable: true }
    Curve:
      type: object
      required: [as_of, verified_percent, pending_percent, spi, spi_status]
      properties:
        as_of: { type: string, format: date }
        grand_total_rab_jasa: { type: string, description: Decimal monetary value }
        verified_percent: { type: number }
        pending_percent: { type: number }
        plan_percent: { type: number }
        spi: { type: number, nullable: true }
        spi_status: { type: string, enum: [healthy, watch, critical, na] }
        verified_series: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' } }
        pending_series: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' } }
        pending_shadow_series: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' } }
        baseline_series: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' } }
        original_baseline_series: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' } }
        revised_baseline_series: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' } }
        original_baseline: { $ref: '#/components/schemas/Baseline', nullable: true }
        revised_baseline: { $ref: '#/components/schemas/Baseline', nullable: true }
        active_baseline_kind: { type: string, nullable: true }
        overdue: { type: boolean }
        baseline_flat_after_toc: { type: boolean }
        x_axis_end: { type: string, format: date }
    Baseline:
      type: object
      required: [kind, version, toc]
      properties:
        kind: { type: string, enum: [original, revised] }
        version: { type: integer }
        toc: { type: string, format: date }
    SeriesPoint:
      type: object
      required: [date, percent]
      properties:
        date: { type: string, format: date }
        percent: { type: number }
    MaterialReference:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        unit: { type: string, nullable: true }
    WarehouseReference:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    Stock:
      type: object
      properties:
        warehouse: { $ref: '#/components/schemas/WarehouseReference' }
        material: { $ref: '#/components/schemas/MaterialReference' }
        mitra: { $ref: '#/components/schemas/MitraReference' }
        location_type: { type: string }
        project: { $ref: '#/components/schemas/ProjectReference' }
        quantity: { type: string, description: Decimal quantity }
        updated_at: { type: string, format: date-time, nullable: true }
    ProjectReference:
      type: object
      required: [id_project, name, mitra]
      properties:
        id_project: { type: string }
        name: { type: string }
        mitra: { $ref: '#/components/schemas/MitraReference' }
    MaterialReadiness:
      type: object
      properties:
        required: { type: string }
        delivered: { type: string }
        transit: { type: string }
        available: { type: string }
        readiness_percent: { type: number, nullable: true }
        state: { type: string }
        items: { type: array, items: { type: object } }
    MaterialRequest:
      type: object
      properties:
        project: { $ref: '#/components/schemas/ProjectReference' }
        mitra: { $ref: '#/components/schemas/MitraReference' }
        status: { type: string }
        items: { type: array, items: { type: object } }
        created_at: { type: string, format: date-time, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
    MaterialTransaction:
      type: object
      properties:
        project: { $ref: '#/components/schemas/ProjectReference' }
        warehouse: { $ref: '#/components/schemas/WarehouseReference' }
        material: { $ref: '#/components/schemas/MaterialReference' }
        transaction_type: { type: string }
        location_type: { type: string }
        quantity_delta: { type: string, description: Decimal quantity delta }
        reason: { type: string }
        occurred_at: { type: string, format: date-time, nullable: true }
    Reconciliation:
      type: object
      properties:
        project: { $ref: '#/components/schemas/ProjectReference' }
        mitra: { $ref: '#/components/schemas/MitraReference' }
        number: { type: string }
        source: { type: string, enum: [manual, go_live] }
        status: { type: string }
        corrects: { type: string, nullable: true }
        is_active: { type: boolean }
        approved_at: { type: string, format: date-time, nullable: true }
        items: { type: array, items: { type: object } }
    ServicePrice:
      type: object
      properties:
        mitra: { $ref: '#/components/schemas/MitraReference' }
        pks_number: { type: string, nullable: true }
        service:
          type: object
          nullable: true
          properties:
            code: { type: string }
            name: { type: string }
        price: { type: string, description: Decimal monetary value }
        status: { type: string }
        valid_from: { type: string, format: date }
        decided_at: { type: string, format: date-time, nullable: true }
    PhotoLink:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        step: { type: string, nullable: true }
        capture_date: { type: string, format: date, nullable: true }
    RiskDistribution:
      type: object
      properties:
        status: { type: string, enum: [healthy, watch, critical, na] }
        count: { type: integer }
        percent: { type: number }
    Trend:
      type: object
      properties:
        as_of: { type: string, format: date }
        points: { type: array, items: { type: object } }
    DecisionQueueItem:
      type: object
      properties:
        category: { type: string }
        risk_status: { type: string, enum: [healthy, watch, critical, na] }
        title: { type: string }
        reason: { type: string }
        project: { $ref: '#/components/schemas/ProjectReference' }
        updated_at: { type: string, format: date-time, nullable: true }
    Activity:
      type: object
      properties:
        project: { $ref: '#/components/schemas/ProjectReference' }
        type: { type: string }
        event_key: { type: string, nullable: true }
        body: { type: string, nullable: true }
        actor: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time, nullable: true }
    Portfolio:
      type: object
      properties:
        kpis: { type: object }
        trend: { $ref: '#/components/schemas/Trend' }
        status_distribution: { type: array, items: { $ref: '#/components/schemas/RiskDistribution' } }
        project_status_distribution: { type: array, items: { type: object } }
        health_matrix: { type: array, items: { $ref: '#/components/schemas/Project' } }
        activity: { type: array, items: { $ref: '#/components/schemas/Activity' } }
        decision_queue: { type: array, items: { $ref: '#/components/schemas/DecisionQueueItem' } }
        project_count: { type: integer }
